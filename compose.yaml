services:
  app:
    # Preserva DB_HOST=db no processo HTTP iniciado pelo Artisan.
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Nome do servico PostgreSQL na rede do Compose.
      DB_HOST: db
      DB_PORT: "5432"
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      # Credenciais ficam no arquivo local, fora da imagem.
      - ./.env:/var/www/html/.env:ro
      # Carrega o registro atualizado das rotas, mesmo com imagem anterior.
      - ./bootstrap/app.php:/var/www/html/bootstrap/app.php:ro
      # Alteracoes nestas pastas aparecem sem reconstruir a imagem.
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./routes:/var/www/html/routes
      - ./resources:/var/www/html/resources
      - ./storage:/var/www/html/storage

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Defina DB_DATABASE no .env}
      POSTGRES_USER: ${DB_USERNAME:?Defina DB_USERNAME no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    ports:
      # 5432 continua reservado ao PostgreSQL original do Windows.
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18 usa este diretorio para persistencia.
      - postgres_data:/var/lib/postgresql
      # Instalacoes novas recebem estrutura limpa, sem dados privados.
      - ./docker/postgres/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  postgres_data:
